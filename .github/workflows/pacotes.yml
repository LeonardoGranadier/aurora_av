# Testa o jogo e gera os pacotes portáteis (com Java embutido) para Linux, Windows e macOS.
# Os pacotes ficam em Actions > (execução) > Artifacts. Se os segredos BUTLER_API_KEY e a variável ITCH_PROJECT
# (ex.: usuario/aventura-em-aurora) estiverem configurados, os pacotes também sobem para a itch.io.
name: Testes e pacotes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Rodar todos os testes
        run: sh testar.sh

  pacotes:
    needs: testes
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, sistema: linux }
          - { os: windows-latest, sistema: windows }
          - { os: macos-latest, sistema: mac }
    runs-on: ${{ matrix.os }}
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Versão do jogo (Game.VERSION)
        run: |
          version=$(sed -n 's/.*static final String VERSION = "\(.*\)";.*/\1/p' Game.java)
          echo "AURORA_VERSAO=$version" >> "$GITHUB_ENV"
      - name: Gerar pacote portátil
        run: sh empacotar.sh --portatil
      - uses: actions/upload-artifact@v4
        with:
          name: AventuraEmAurora-${{ matrix.sistema }}
          path: dist/AventuraEmAurora-${{ matrix.sistema }}
      - name: Gerar pacote da Steam (só ao rodar manualmente)
        if: github.event_name == 'workflow_dispatch'
        run: sh empacotar.sh --steam --portatil
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: AventuraEmAurora-${{ matrix.sistema }}-steam
          path: dist/AventuraEmAurora-${{ matrix.sistema }}-steam
      - name: Enviar para a itch.io (opcional)
        if: github.ref == 'refs/heads/main' && env.BUTLER_API_KEY != '' && vars.ITCH_PROJECT != ''
        run: |
          case "${{ matrix.sistema }}" in linux) arch=linux-amd64 ;; windows) arch=windows-amd64 ;; mac) arch=darwin-amd64 ;; esac
          curl -L -o butler.zip "https://broth.itch.zone/butler/$arch/LATEST/archive/default"
          unzip -q butler.zip -d butler && chmod +x butler/butler* || true
          ./butler/butler push "dist/AventuraEmAurora-${{ matrix.sistema }}" "${{ vars.ITCH_PROJECT }}:${{ matrix.sistema }}" --userversion "$AURORA_VERSAO"
